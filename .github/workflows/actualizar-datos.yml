name: Actualizar datos del dashboard

on:
  schedule:
    # Todos los días a las 12:00 UTC (~8-9am en Chile, según horario de verano)
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: node actualizar-datos.js

      - name: Publicar datos.js si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos.js
          git diff --staged --quiet || git commit -m "Actualizar datos automáticamente ($(date -u +%Y-%m-%d))"
          git push
